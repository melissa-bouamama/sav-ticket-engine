[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "moteur-sav"
version = "0.2.0"
description = "Support-ticket engine in pure Python: robust ingestion, hand-written heap, undo/redo, inverted index, greedy assignment"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["data-structures", "algorithms", "customer-support", "inverted-index", "priority-queue"]

[project.optional-dependencies]
dev = ["pytest>=7", "ruff>=0.5"]
demo = ["streamlit>=1.30", "matplotlib>=3.7"]

[project.scripts]
moteur-sav = "moteur_sav.cli:main"

[tool.setuptools]
packages = ["moteur_sav"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py310"
extend-exclude = ["*.ipynb"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501", "B905", "E741", "B023", "B007"]  # `l` in short comprehensions; closures called immediately
